name: Build APK

on:

push:

branches: [main, master] workflow_dispatch:

job

build:

runs-on: ubuntu-latest

steps:

name: Get the code

uses: actions/checkout@v4

name: Set up Node

uses: actions/setup-node@v4

node-version: 20

name: Set up Java

uses: actions/setup-java@v4

with:

distribution: temurin

java-version:

17

name: Prepare the app project

run:

cp index.html www/index.html

npm init -y

npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6

@capacitor/app@6

cat > capacitor.config.json <<'EOF'

"appId": "com.oddscalc.app",

"appName": "Odds Calculator",

"webDir": "www",

"backgroundColor": "#14171c"

name: Add Android and copy the app into it

run:

npx cap add android

npx cap sync android

name: Build the APK

working-directory: android run: ./gradlew assembleDebug

name: Save the APK

uses: actions/upload-artifact@v4

with

name: odds-calculator-apk path: android/app/build/outputs
